name: Test z3 latest release

on:
  schedule:
    - cron: '45 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  z3_workflow:
    runs-on: ubuntu-latest
    env:
      NUM_TESTS: 1000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python and System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ghc cabal-install sqlite3
          python3 -m venv ./venv
          source ./venv/bin/activate
          pip install poetry
          cabal update
          cabal install --lib testing-feat
          cabal install --lib size-based

      - name: Set up Git user
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: Clone ET and Install Python Dependencies
        run: |
          git clone --branch dev https://github.com/wintered/ET.git
          cd ET
          source ../venv/bin/activate
          poetry install
          cd ..

      - name: Create solver-specific config
        run: |
          cp ./solvers.cfg ./solvers-z3.cfg

      - name: Debug - Show initial state
        run: |
          echo "=== DEBUG: Initial state ==="
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -la
          echo "Git status:"
          git status
          echo "Git log (last 3 commits):"
          git log --oneline -3
          echo "=== END DEBUG ==="

      - name: Check and update solver version
        id: check_version
        run: |
          echo "=== DEBUG: Starting z3-latest.main ==="
          source venv/bin/activate
          pip install -r requirements.txt
          echo "Python version: $(python --version)"
          echo "Current working directory: $(pwd)"
          echo "Files before running main:"
          ls -la
          echo "Versions file content before (if exists):"
          cat ./versions || echo "versions file does not exist"
          echo "Running: python -m z3-latest.main"
          python -m z3-latest.main
          echo "Exit code: $?"
          echo "Files after running main:"
          ls -la
          echo "Versions file content after:"
          cat ./versions || echo "versions file still does not exist"
          echo "Git status after main:"
          git status
          echo "=== END DEBUG ==="

      - name: Debug - Show state before git operations
        run: |
          echo "=== DEBUG: State before git operations ==="
          echo "Current directory: $(pwd)"
          echo "Git status:"
          git status
          echo "Git remote:"
          git remote -v
          echo "Git branch:"
          git branch -a
          echo "Versions file:"
          cat ./versions || echo "versions file does not exist"
          echo "Git diff:"
          git diff || echo "No changes to show"
          echo "Git diff --cached:"
          git diff --cached || echo "No staged changes"
          echo "=== END DEBUG ==="

      - name: Commit and push version changes
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          echo "=== DEBUG: Starting git operations ==="
          echo "Version changed output: ${{ steps.check_version.outputs.version_changed }}"
          echo "Attempting git pull..."
          git pull origin main --rebase || git pull origin main || echo "Pull failed, continuing with local changes"
          echo "Git pull exit code: $?"
          echo "Git status after pull:"
          git status
          echo "Attempting git add ./versions..."
          git add ./versions
          echo "Git add exit code: $?"
          echo "Git status after add:"
          git status
          echo "Git diff --cached:"
          git diff --cached || echo "No staged changes"
          echo "Attempting git commit..."
          git commit -m "Update solver version" --only ./versions
          echo "Git commit exit code: $?"
          echo "Git status after commit:"
          git status
          echo "Attempting git push..."
          git push
          echo "Git push exit code: $?"
          echo "=== END DEBUG ==="

      - name: Run experiment for each theory
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          chmod +x ./scripts/run_exp.sh
          chmod +x ./binaries/cvc5-1.2.0
          chmod +x ./binaries/z3-4.8.11
          chmod +x ./binaries/z3-4.13.3
          for theory in $(cat ./supported_theories/z3); do
            ./scripts/run_exp.sh "$theory" "$NUM_TESTS" "./solvers-z3.cfg"
          done

      - name: Store experiment results
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          chmod +x ./scripts/create_db.sh
          for theory in $(cat ./supported_theories/z3); do
            ./scripts/create_db.sh "$theory"
          done

      - name: Gather statistics
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          chmod +x ./scripts/gather_statistics.sh
          ./scripts/gather_statistics.sh ./results ./found_bugs/z3_bugs

      - name: Commit unsoundness bugs
        if: env.UNSOUNDNESS_FOUND == 'true'
        run: |
            git add ./found_bugs/z3_bugs
            git commit -m "Add unsoundness bugs"
            git push

      - name: Fail the action if unsoundness is found
        if: env.UNSOUNDNESS_FOUND == 'true'
        run: exit 1
